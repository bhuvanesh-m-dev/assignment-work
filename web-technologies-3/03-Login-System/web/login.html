<!DOCTYPE html>
<html>
<head>
    <title>Login System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            margin-top: 100px;
        }

        .login {
            width: 350px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
        }

        button {
            padding: 10px 30px;
        }
    </style>
</head>

<body>

<div class="login">

    <h1>Login</h1>

    <form action="login" method="post">

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
