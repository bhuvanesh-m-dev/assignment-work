<!DOCTYPE html>
<html>
<head>
    <title>Arithmetic Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            margin-top: 80px;
        }

        .calculator {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input, select {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 25px;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>Arithmetic Calculator</h1>

    <form action="calculator" method="post">

        <input type="number"
               step="any"
               name="num1"
               placeholder="First Number"
               required>

        <input type="number"
               step="any"
               name="num2"
               placeholder="Second Number"
               required>

        <select name="operation">

            <option value="add">
                Addition
            </option>

            <option value="sub">
                Subtraction
            </option>

            <option value="mul">
                Multiplication
            </option>

            <option value="div">
                Division
            </option>

        </select>

        <button type="submit">
            Calculate
        </button>

    </form>

</div>

</body>
</html>
