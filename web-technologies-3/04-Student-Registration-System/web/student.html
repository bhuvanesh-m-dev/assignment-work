<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            margin-top: 40px;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Registration</h1>

    <form action="student" method="post">

        <input type="number"
               name="rollno"
               placeholder="Roll Number"
               required>

        <input type="text"
               name="name"
               placeholder="Student Name"
               required>

        <input type="text"
               name="department"
               placeholder="Department"
               required>

        <input type="email"
               name="email"
               placeholder="Email"
               required>

        <input type="text"
               name="phone"
               placeholder="Phone Number"
               required>

        <br>

        <button type="submit">
            Register Student
        </button>

    </form>

    <br>

    <form action="student" method="get">

        <button type="submit">
            View Students
        </button>

    </form>

</div>

</body>
</html>
