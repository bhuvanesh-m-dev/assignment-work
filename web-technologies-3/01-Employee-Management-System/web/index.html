<!DOCTYPE html>
<html>
<head>
    <title>Employee Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            margin-top: 50px;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Employee Management</h1>

    <form action="employee" method="post">

        <input type="number"
               name="id"
               placeholder="Employee ID"
               required>

        <input type="text"
               name="name"
               placeholder="Employee Name">

        <input type="text"
               name="department"
               placeholder="Department">

        <input type="number"
               step="0.01"
               name="salary"
               placeholder="Salary">

        <br>

        <button type="submit" name="action" value="add">
            Add
        </button>

        <button type="submit" name="action" value="update">
            Update
        </button>

        <button type="submit" name="action" value="delete">
            Delete
        </button>

        <button type="submit" name="action" value="display">
            Display
        </button>

    </form>

</div>

</body>
</html>
